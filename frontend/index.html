<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex align-items-center">
        <span class="navbar-brand mb-0">
            Expense Tracker
        </span>

        <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">
            <span id="themeIcon">🌙</span>
        </button>
    </div>
</nav>

    <main class="container py-4">

        <!-- Alerts -->
        <div id="alertContainer"></div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center my-4 d-none">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>

            <p class="mt-2">Loading expenses...</p>
        </div>

        <!-- Summary Cards -->
        <section class="summary-grid mb-4">

            <div class="card summary-card">
                <div class="card-body">
                    <h6 class="text-muted">Total Amount</h6>
                    <h2 id="totalAmount">$0.00</h2>
                </div>
            </div>

            <div class="card summary-card">
                <div class="card-body">
                    <h6 class="text-muted">Number of Expenses</h6>
                    <h2 id="expenseCount">0</h2>
                </div>
            </div>

            <div class="card summary-card">
                <div class="card-body">
                    <h6 class="text-muted">Highest Expense</h6>
                    <h2 id="highestExpense">$0.00</h2>
                </div>
            </div>


             <div class="card summary-card">
                <div class="card-body">
                    <h6 class="text-muted">Highest catgory</h6>
                    <h2 id="highestCategory">-</h2>
                </div>
            </div>

        </section>


        <!-- Add Expense -->
        <section class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Add Expense</h5>
            </div>

            <div class="card-body">

                <form id="expenseForm" novalidate>

                    <div class="row g-3">

                        <!-- Title -->
                        <div class="col-md-6">
                            <label for="title" class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                required
                            >

                            <div class="invalid-feedback">
                                Title is required.
                            </div>
                        </div>


                        <!-- Amount -->
                        <div class="col-md-6">
                            <label for="amount" class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                required
                            >

                            <div class="invalid-feedback">
                                Amount must be greater than 0.
                            </div>
                        </div>


                        <!-- Category -->
                        <div class="col-md-6">
                            <label for="category" class="form-label">
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                                required
                            >
                                <option value="">Choose...</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">
                                    Entertainment
                                </option>
                                <option value="Health">Health</option>
                                <option value="Other">Other</option>
                            </select>

                            <div class="invalid-feedback">
                                Category is required.
                            </div>
                        </div>


                        <!-- Date -->
                        <div class="col-md-6">
                            <label for="date" class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                id="date"
                                class="form-control"
                                required
                            >

                            <div class="invalid-feedback">
                                Date is required.
                            </div>
                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary mt-3"
                    >
                        Add Expense
                    </button>

                </form>

            </div>
        </section>


        <!-- Expenses -->
        <section class="card">

            <div class="card-body">

                <div
                    class="d-flex flex-column flex-md-row
                           justify-content-between
                           align-items-md-center
                           gap-3 mb-3"
                >

                    <h5 class="mb-0">
                        Expenses
                    </h5>


                    <!-- Filter -->
                    <div class="d-flex align-items-center gap-2">

                        <label
                            for="categoryFilter"
                            class="form-label mb-0"
                        >
                            Filter:
                        </label>

                        <select
                            id="categoryFilter"
                            class="form-select"
                        >
                            <option value="All">All</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">
                                Entertainment
                            </option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>

                    </div>

                </div>


                <!-- Table -->
                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>Title</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="expenseTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <!-- Edit Modal -->
    <div
        class="modal fade"
        id="editModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <form id="editForm" novalidate>

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Edit Expense
                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>

                    </div>


                    <div class="modal-body">

                        <input
                            type="hidden"
                            id="editId"
                        >


                        <div class="mb-3">

                            <label
                                for="editTitle"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                id="editTitle"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="editAmount"
                                class="form-label"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                id="editAmount"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="editCategory"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="editCategory"
                                class="form-select"
                                required
                            >
                                <option value="Food">Food</option>
                                <option value="Transport">
                                    Transport
                                </option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">
                                    Entertainment
                                </option>
                                <option value="Health">Health</option>
                                <option value="Other">Other</option>
                            </select>

                        </div>


                        <div class="mb-3">

                            <label
                                for="editDate"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                id="editDate"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>




    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Our JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
